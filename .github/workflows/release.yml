name: Release

# Builds the signed phone and watch APKs and publishes them as a GitHub release.
# Runs for every change that lands on main.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEPOT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEPOT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The DEPOT_KEYSTORE_BASE64 secret is missing. See 'Releases' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depot-release.jks"
          echo "DEPOT_KEYSTORE_FILE=$RUNNER_TEMP/depot-release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :core:testDebugUnitTest

      - name: Build signed APKs
        env:
          DEPOT_KEYSTORE_PASSWORD: ${{ secrets.DEPOT_KEYSTORE_PASSWORD }}
          DEPOT_KEY_ALIAS: ${{ secrets.DEPOT_KEY_ALIAS }}
          DEPOT_KEY_PASSWORD: ${{ secrets.DEPOT_KEY_PASSWORD }}
        run: ./gradlew :phone:assembleRelease :wear:assembleRelease

      - name: Collect and verify the APKs
        run: |
          mkdir -p dist
          cp phone/build/outputs/apk/release/phone-release.apk dist/depot-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk dist/depot-wear.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify dist/depot-phone.apk
          "$apksigner" verify dist/depot-wear.apk
          echo "VERSION=$(./gradlew -q printVersion | tail -n 1)" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/depot-phone.apk dist/depot-wear.apk \
            --target "$GITHUB_SHA" --title "Depot $VERSION" --generate-notes
name: CI

# Checks every pull request, including the daily dependency updates from Dependabot.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :core:testDebugUnitTest

      - name: Lint
        run: ./gradlew :phone:lintDebug :wear:lintDebug

      # Unsigned here: pull requests never see the signing key.
      - name: Build release APKs
        run: ./gradlew :phone:assembleRelease :wear:assembleRelease
